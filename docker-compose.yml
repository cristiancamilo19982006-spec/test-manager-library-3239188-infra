services:
  db:
    image: mysql:8.0
    container_name: manager_library_db
    restart: always
    environment:
      MYSQL_DATABASE: manager_library
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306" 
      
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: